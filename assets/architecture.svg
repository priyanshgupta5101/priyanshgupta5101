<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350">
  <defs>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: transparent; }
    .box { fill: #ffffff; stroke: #e1e4e8; stroke-width: 2px; }
    .box-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #24292e; text-anchor: middle; }
    .line { stroke: url(#line-grad); stroke-width: 2px; fill: none; stroke-dasharray: 6 6; animation: dash 20s linear infinite; }
    .arrow { fill: #3fb950; }
    
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .box-text { fill: #c9d1d9; }
      .line { stroke: url(#line-grad); }
    }
  </style>

  <!-- Background -->
  <rect width="800" height="350" class="bg" />

  <!-- Connections -->
  <path d="M400,60 L400,100" class="line" />
  <polygon points="395,95 405,95 400,105" class="arrow" />

  <path d="M400,140 L400,170" class="line" />
  
  <path d="M400,170 L200,170 L200,200" class="line" />
  <polygon points="195,195 205,195 200,205" class="arrow" />

  <path d="M400,170 L400,200" class="line" />
  <polygon points="395,195 405,195 400,205" class="arrow" />

  <path d="M400,170 L600,170 L600,200" class="line" />
  <polygon points="595,195 605,195 600,205" class="arrow" />

  <path d="M200,240 L200,270 L400,270 L400,290" class="line" />
  <path d="M400,240 L400,290" class="line" />
  <path d="M600,240 L600,270 L400,270 L400,290" class="line" />
  <polygon points="395,285 405,285 400,295" class="arrow" />

  <!-- Nodes -->
  <!-- Client -->
  <rect x="300" y="20" width="200" height="40" rx="8" class="box" />
  <text x="400" y="45" class="box-text">Client / User</text>

  <!-- API Layer -->
  <rect x="300" y="100" width="200" height="40" rx="8" class="box" />
  <text x="400" y="125" class="box-text">Web / API Layer</text>

  <!-- Application Services -->
  <rect x="120" y="200" width="160" height="40" rx="8" class="box" />
  <text x="200" y="225" class="box-text">Application Services</text>

  <!-- AI/ML Services -->
  <rect x="320" y="200" width="160" height="40" rx="8" class="box" />
  <text x="400" y="225" class="box-text">AI / ML Services</text>

  <!-- Async Workers -->
  <rect x="520" y="200" width="160" height="40" rx="8" class="box" />
  <text x="600" y="225" class="box-text">Async Jobs / Workers</text>

  <!-- Database -->
  <rect x="300" y="290" width="200" height="40" rx="8" class="box" />
  <text x="400" y="315" class="box-text">Data / Storage</text>

</svg>
