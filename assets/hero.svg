<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250">
  <defs>
    <!-- Light Mode Gradient -->
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fa" />
      <stop offset="100%" stop-color="#e1e4e8" />
    </linearGradient>
    <linearGradient id="accent-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0366d6" />
      <stop offset="100%" stop-color="#28a745" />
    </linearGradient>
    
    <!-- Dark Mode Gradient -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="accent-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <!-- Pattern -->
    <pattern id="pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="currentColor" class="dot"/>
    </pattern>
  </defs>

  <style>
    .bg { fill: url(#bg-light); }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 48px; fill: #24292e; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #586069; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 14px; fill: #24292e; }
    .accent { fill: url(#accent-light); }
    .dot { fill: #24292e; opacity: 0.05; }
    
    @media (prefers-color-scheme: dark) {
      .bg { fill: url(#bg-dark); }
      .title { fill: #c9d1d9; }
      .subtitle { fill: #8b949e; }
      .desc { fill: #c9d1d9; }
      .accent { fill: url(#accent-dark); }
      .dot { fill: #c9d1d9; opacity: 0.03; }
    }
  </style>

  <!-- Background -->
  <rect width="800" height="250" rx="15" class="bg" />
  
  <!-- Grid Pattern -->
  <rect width="800" height="250" rx="15" fill="url(#pattern)" />

  <!-- Accent Line -->
  <rect x="0" y="0" width="800" height="6" class="accent" rx="3" />

  <!-- Content -->
  <g transform="translate(50, 80)">
    <text x="0" y="0" class="title">Priyansh Gupta</text>
    <text x="0" y="35" class="subtitle">Software Engineer · Full-Stack · AI/ML · Backend</text>
    
    <text x="0" y="80" class="desc">Building practical software systems with modern technologies,</text>
    <text x="0" y="100" class="desc">intelligent features, asynchronous workflows, and scalable architectures.</text>
  </g>

  <!-- Abstract Shapes for visual richness -->
  <g transform="translate(650, 120)">
    <circle cx="0" cy="0" r="40" class="accent" opacity="0.1" />
    <circle cx="-20" cy="-20" r="20" class="accent" opacity="0.2" />
    <rect x="20" y="10" width="30" height="30" rx="5" class="accent" opacity="0.15" />
  </g>
</svg>
